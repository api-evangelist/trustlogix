apis:
- name: TrustLogix REST API
  description: >-
    REST API for the TrustLogix platform — manage data source accounts, data
    access policies (create / impact-preview / review / publish), data-source
    tags and associations, monitoring policies (v1 and v2), users and user
    attributes, and session login/logout. API-key auth via the Authorization
    header with a tenantId header on tenant-scoped calls; offset pagination
    (page_no/page_size/sort_by/sort_order); a { code, data, message } response
    envelope.
