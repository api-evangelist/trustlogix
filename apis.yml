aid: trustlogix
name: Trustlogix
description: >-
  TrustLogix is a data security and access governance platform that unifies data
  visibility, policy enforcement, and AI protection across cloud, on-premises, and
  hybrid data systems. It continuously detects inappropriate access, enforces
  least-privilege and attribute-based (ABAC) / role-based (RBAC) controls, and
  governs how users, service accounts, and AI agents reach sensitive data across
  platforms such as Snowflake, Databricks, Dremio, SQL Server, and Power BI. The
  platform includes Trust DSPM (data security posture management), Trust Access
  (data access governance with masking, row-access, and tag-based policies), and
  Trust AI — an agentic layer whose Guardian Agent and TrustAI MCP Server broker
  real-time policy decisions for registered AI agents. TrustLogix exposes a REST
  API for accounts, access policies, tags, monitoring policies, and users, plus
  SSO (Azure AD / Okta) with SCIM 2.0 provisioning.
